name: Windows x64 release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Windows x64 executable
        run: cargo build --release --locked

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\health-reminder.exe dist\health-reminder-windows-x64.exe
          Copy-Item README.md, LICENSE dist\
          Compress-Archive -Path dist\health-reminder-windows-x64.exe, dist\README.md, dist\LICENSE -DestinationPath dist\health-reminder-windows-x64.zip -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          gh release create "$env:TAG_NAME" `
            dist\health-reminder-windows-x64.exe `
            dist\health-reminder-windows-x64.zip `
            --title "Health Reminder $version" `
            --notes "Windows x64 build. Download the EXE for a quick start, or the ZIP for the EXE, README, and license."
