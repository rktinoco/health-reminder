[package]
name = "health_reminder"
version = "2026.2.0"
edition = "2021"
description = "A dependency-free Windows tray app for hydration and exercise reminders"

[[bin]]
name = "health-reminder"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
